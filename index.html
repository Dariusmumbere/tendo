<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TendoConnect Technologies</title>
<meta name="theme-color" content="#0a2a2f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a2a2f;--ink2:#123d44;--teal:#0f9d8a;--tealdk:#0b7a6b;--sun:#ffb81c;--bg:#f2f5f5;--card:#fff;--line:#e2e9e9;--mut:#5f767a;--bad:#b3261e;--warn:#9a6400;--ok:#0f7a3f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .5rem;line-height:1.15;letter-spacing:-.02em}h1{font-size:28px;font-weight:800}h2{font-size:21px;font-weight:800}h3{font-size:16px;font-weight:700}
a{color:var(--tealdk);font-weight:600}button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:.7rem 1.1rem;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:var(--ink2)}.btn:active{transform:scale(.98)}
.btn.sun{background:var(--sun);color:var(--ink);font-size:16px;padding:.9rem 1.1rem}.btn.sun:hover{background:#ffc94d}
.btn.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn.sec:hover{background:#f4f8f8}
.btn.bad{background:var(--bad)}.btn.sm{padding:.3rem .7rem;font-size:13px;border-radius:8px}.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{width:100%;padding:.75rem .85rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--teal);outline:3px solid #0f9d8a26}
label{display:block;font-weight:700;font-size:14px;margin:1rem 0 .3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem}
.wrap .card,.modal .card{box-shadow:0 12px 32px -16px #0a2a2f40}
.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.1rem .6rem;border-radius:99px;font-size:12.5px;font-weight:700;background:#e9efef;color:var(--mut)}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-Active,.b-Completed,.b-Online,.b-Paid{background:#dff3e6;color:var(--ok)}.b-Pending,.b-Maintenance,.b-Suspended{background:#fdf0d5;color:var(--warn)}
.b-Failed,.b-Cancelled,.b-Terminated,.b-Offline,.b-Refunded{background:#fbe3e1;color:var(--bad)}
.muted{color:var(--mut)}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:19px;letter-spacing:-.02em}.brand svg{width:28px;height:28px;flex:none}
.top{background:var(--ink);color:#fff;padding:.9rem 1rem}.top .in{max-width:560px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top a{color:#a9dcd4;font-size:14px;text-decoration:none}
.hero{background:var(--ink);color:#fff;padding:1.4rem 1rem 5.6rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-150px;top:-170px;width:480px;height:480px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 34px,#ffffff12 34px 36px)}
.hero .in{max-width:560px;margin:auto;position:relative;z-index:1}.hero h1{font-size:34px;max-width:11ch}.hero p{color:#b7d3cf;margin:.5rem 0 0;max-width:34ch}
.wrap{max-width:560px;margin:0 auto;padding:1rem}.wrap.up{margin-top:-4.4rem;position:relative;z-index:2}
.wrap>h1{margin:1rem 0 .8rem}.wrap>.card:first-child{margin-top:1rem}.wrap.up>.card:first-child{margin-top:0}
.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.pkg{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1rem;background:#fff;cursor:pointer;text-align:left;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}
.pkg:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 14px 28px -18px #0a2a2f4d}.pkg:active{transform:translateY(0) scale(.98)}
.pkg .dur{display:block;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pkg b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:.3rem}
.pkg .px{display:block;color:var(--tealdk);font-weight:800;margin-top:.2rem;font-size:15px}
.pkg .tag{position:absolute;top:-9px;right:12px;background:var(--sun);color:var(--ink);font-size:10.5px;font-weight:800;padding:.2rem .55rem;border-radius:99px;box-shadow:0 4px 10px -4px #0a2a2f66;text-transform:uppercase;letter-spacing:.03em}
.voucher{background:linear-gradient(135deg,var(--ink),var(--ink2) 120%);border-radius:16px;padding:1.15rem 1.25rem;color:#fff;margin:1rem 0}
.voucher .lbl{font-size:11.5px;font-weight:800;color:#9fc6c0;text-transform:uppercase;letter-spacing:.06em}
.voucher .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:27px;font-weight:800;letter-spacing:.07em;margin:.35rem 0 .7rem;word-break:break-all}
.voucher .btn{padding:.55rem .9rem;font-size:13.5px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--ink);padding:1.1rem .8rem;position:sticky;top:0;height:100vh}.side .brand{color:#fff;padding:.2rem .6rem 1.4rem}
.side a{display:block;padding:.6rem .8rem;border-radius:10px;color:#b7d3cf;text-decoration:none;cursor:pointer;font-weight:600;margin-bottom:2px;border-left:3px solid transparent}
.side a:hover{background:#ffffff10;color:#fff}.side a.on{background:#ffffff14;color:#fff;border-left-color:var(--sun)}
.main{padding:1.6rem;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem}.bar h1{margin:0;font-size:26px}
.menu{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}
.stats .card{padding:1.1rem 1.2rem}.stats .card span{font-size:13px;font-weight:600}.stats .card b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:.1rem}
.stats .card.key{background:var(--ink);border-color:var(--ink)}.stats .card.key span{color:#9fc6c0}.stats .card.key b{color:var(--sun)}
.tw{overflow-x:auto}.tw.card{padding:0;overflow:auto}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:.7rem .9rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12.5px;font-weight:700;color:var(--mut);background:#f7fafa;position:sticky;top:0}td.row{display:table-cell}td.row .btn{margin-right:.3rem}
tbody tr:hover td{background:#f9fcfc}tbody tr:last-child td{border-bottom:0}
.modal{position:fixed;inset:0;background:#0a2a2f88;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.modal .card{width:100%;max-width:520px;max-height:92vh;overflow:auto;animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(10px);opacity:0}}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:30;display:grid;gap:.5rem}.toast{background:var(--ink);color:#fff;padding:.75rem 1rem;border-radius:10px;max-width:320px;font-weight:600;box-shadow:0 10px 30px -10px #0a2a2f80}.toast.err{background:var(--bad)}
.empty,.err{padding:2.4rem 1rem;text-align:center;color:var(--mut)}.err{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.2rem}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
.bars div{height:10px;background:var(--teal);border-radius:5px;margin:.2rem 0 .7rem}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:fixed;left:-250px;width:240px;z-index:15;transition:left .2s}.side.open{left:0}.menu{display:inline-block}.main{padding:1rem}.hero h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div><div id="toasts" aria-live="polite"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), UGX=n=>'UGX '+Number(n||0).toLocaleString('en-US');
const fmt=d=>d?new Date(d).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>s?`<span class="badge b-${esc(s)}">${esc(s)}</span>`:'—';
const API='https://tendoconnect.onrender.com/api';
let token=localStorage.getItem('tc_token');

function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),4500)}
async function api(path,{method='GET',body,auth=true}={}){
  let r;
  try{r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth&&token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined})}
  catch{throw new Error('Cannot reach the server. Check your internet connection and try again.')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&auth&&token){token=null;localStorage.removeItem('tc_token');route()}
  if(!r.ok){const d=j.detail;throw new Error(Array.isArray(d)?(d[0].msg||'Please check your input.').replace(/^Value error, /,''):d||'Request failed.')}
  return j}
const busy=async(btn,fn)=>{btn.disabled=true;try{await fn()}catch(e){toast(e.message,true)}finally{btn.disabled=false}};
async function copyCode(text,btn){
  if(!text)return;
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
    else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}
    const t=btn.textContent;btn.textContent='Copied!';setTimeout(()=>{if(btn.isConnected)btn.textContent=t},1600)
  }catch{toast('Could not copy automatically — please select and copy the code by hand.',true)}}
const shell=(html,narrow)=>{$('#root').innerHTML=html};

/* ---------- customer purchase ---------- */
const LOGO='<svg viewBox="0 0 32 32" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 12a17 17 0 0 1 24 0" style="stroke:var(--arc,#4fd6c1)"/><path d="M8.5 17a11 11 0 0 1 15 0" style="stroke:var(--arc,#4fd6c1)"/><path d="M12.8 22a5 5 0 0 1 6.4 0" stroke="#ffb81c"/><circle cx="16" cy="26" r="1.6" fill="#ffb81c" stroke="none"/></svg>';
const topbar=`<div class="top"><div class="in"><div class="brand">${LOGO}TendoConnect</div><a href="#/portal">My account</a></div></div>`;
let buy={};
const pkgHours=p=>p.duration*(p.duration_unit==='Days'?24:p.duration_unit==='Minutes'?1/60:1);
const pkgDur=p=>`${p.duration} ${p.duration_unit==='Hours'?'hour':p.duration_unit==='Days'?'day':'minute'}${p.duration>1?'s':''}`;
async function viewBuy(){
  shell(topbar+`<div class="hero"><div class="in"><h1>Get online in a minute</h1><p>Pick a package below — you'll enter your phone number on the next step, right before you pay.</p></div></div><div class="wrap up"><div id="b" class="card"><p class="muted">Loading packages…</p></div></div>`);
  try{buy.pk=await api('/public/packages',{auth:false})}catch(e){$('#b').innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  if(!buy.pk.length){$('#b').innerHTML='<div class="empty">No packages are available right now. Please check back soon.</div>';return}
  const best=buy.pk.length>1?buy.pk.reduce((a,p)=>pkgHours(p)&&(!a||p.price/pkgHours(p)<a.price/pkgHours(a))?p:a,null):null;
  $('#b').innerHTML=`<label style="margin-top:0">Choose your package</label><div class="pkgs">${buy.pk.map(p=>`<button class="pkg" data-id="${p.id}">${best&&p.id===best.id?'<span class="tag">Best value</span>':''}<span class="dur">${esc(pkgDur(p))} access</span><b>${esc(p.name)}</b><span class="px">${UGX(p.price)}</span></button>`).join('')}</div>
  <p class="muted" style="text-align:center;font-size:13px;margin:1rem 0 0">Secure payment by Pesapal · Mobile Money and cards</p>`;
  document.querySelectorAll('.pkg').forEach(b=>b.onclick=()=>openPay(buy.pk.find(p=>p.id===+b.dataset.id)))}
function openPay(p){
  const m=modal(`<h2>${esc(p.name)}</h2><p class="muted" style="margin-top:-.3rem">${UGX(p.price)} · ${esc(pkgDur(p))} of access${p.description?' · '+esc(p.description):''}</p>
  <label for="ph">Your phone number</label><input id="ph" inputmode="tel" placeholder="0772 123 456" autocomplete="tel">
  <p class="muted" style="font-size:12.5px;margin:.4rem 0 0">Used for Mobile Money payment and to send your receipt.</p>
  <p class="row" style="margin-top:1.15rem"><button class="btn sun" id="pay" style="flex:1">Pay ${UGX(p.price)}</button><button class="btn sec" id="pcx">Cancel</button></p>`);
  $('#pcx',m).onclick=()=>m.remove();
  setTimeout(()=>$('#ph',m)?.focus(),50);
  $('#pay',m).onclick=e=>busy(e.target,async()=>{
    const digits=($('#ph',m).value||'').replace(/\D/g,'');
    if(digits.length<9||digits.length>15)throw new Error('Enter a valid phone number, e.g. 0772 123 456.');
    const o=await api('/orders',{method:'POST',auth:false,body:{phone:$('#ph',m).value,package_id:p.id}});
    if(!o.redirect_url)throw new Error('Payment could not be started. Please try again.');
    e.target.textContent='Opening secure payment…';location.href=o.redirect_url})}
async function viewReceipt(ref){
  shell(topbar+`<div class="wrap"><div class="card" id="r"><h2>Confirming your payment…</h2><p class="muted">Please keep this page open. This can take up to a minute.</p></div></div>`);
  for(let i=0;i<45;i++){
    let o;try{o=await api('/payments/status/'+encodeURIComponent(ref),{auth:false})}catch(e){if(i>2)return $('#r').innerHTML=`<h2>We couldn't check your payment</h2><p class="muted">${esc(e.message)}</p><p>Your receipt code is <b>${esc(ref)}</b>. If money left your account it is applied automatically. Check <a href="#/portal">My account</a> in a few minutes.</p>`}
    if(o&&o.payment_status!=='Pending')return receipt(o);
    await new Promise(r=>setTimeout(r,4000));if(!location.hash.includes(ref))return}
  $('#r').innerHTML=`<h2>Still waiting for confirmation</h2><p class="muted">If you completed payment, your package is activated automatically once the provider confirms it. Receipt code: <b>${esc(ref)}</b>. Check <a href="#/portal">My account</a> shortly.</p>`}
function receipt(o){const s=o.session;
  if(!(o.payment_status==='Completed'&&s)){
    $('#r').innerHTML=`<h2>Payment ${esc(o.payment_status.toLowerCase())}</h2><p class="muted">Your internet package was not activated. Please try again.</p><a class="btn" href="#/" style="text-decoration:none;display:inline-block">Try again</a>`;return}
  $('#r').innerHTML=`<h2>You're connected</h2><p class="muted">${esc(o.package)} · ${UGX(o.amount)} paid</p>
  <div class="voucher"><span class="lbl">Your voucher code</span><div class="code">${esc(s.voucher_code||'—')}</div>${s.voucher_code?'<button class="btn sec" id="cpv">Copy code</button>':''}</div>
  <dl class="kv"><dt>Valid until</dt><dd><b>${fmt(s.expires_at)}</b></dd><dt>Receipt code</dt><dd>${esc(o.ref)}</dd></dl>
  <p class="muted">Keep this code safe — it's how you get online, and how you look up your account later with your phone number.</p><p><a href="#/portal">View my account</a></p>`;
  if(s.voucher_code)$('#cpv').onclick=()=>copyCode(s.voucher_code,$('#cpv'))}

/* ---------- customer portal ---------- */
function viewPortal(){
  shell(topbar+`<div class="wrap"><h1>My account</h1><div class="card" id="p"><p class="muted">Enter your phone number and a receipt code from any of your purchases.</p>
  <label for="pp">Phone number</label><input id="pp" inputmode="tel"><label for="pr">Receipt code</label><input id="pr" placeholder="TC-XXXXXXXXXXXX">
  <p><button class="btn" id="pgo">Show my account</button> <a href="#/">Buy a package</a></p></div></div>`);
  $('#pgo').onclick=e=>busy(e.target,async()=>{const d=await api('/portal/lookup',{method:'POST',auth:false,body:{phone:$('#pp').value,receipt:$('#pr').value}});const s=d.current_session;
    $('#p').innerHTML=`<h2>Hello, ${esc(d.name)}</h2>${s?`${s.voucher_code?`<div class="voucher"><span class="lbl">Active voucher</span><div class="code">${esc(s.voucher_code)}</div><button class="btn sec" data-copy="${esc(s.voucher_code)}">Copy code</button></div>`:''}<dl class="kv"><dt>Current package</dt><dd>${esc(s.package)}</dd><dt>Internet expires</dt><dd><b>${fmt(s.expires_at)}</b></dd><dt>Session</dt><dd>${badge(s.status)}</dd></dl>`:'<p class="muted">No active internet package. <a href="#/">Buy one</a></p>'}
    <h3 style="margin-top:1rem">Purchases &amp; payments</h3>${d.purchases.length?d.purchases.map(p=>`<div style="border-top:1px solid var(--line);padding:.6rem 0"><div class="row" style="justify-content:space-between"><div><b>${esc(p.package)}</b><br><small class="muted">${fmt(p.created_at)} · ${esc(p.method)}</small></div><div style="text-align:right">${UGX(p.amount)}<br>${badge(p.status)}</div></div>${p.voucher_code?`<div class="row" style="margin-top:.4rem;justify-content:space-between;align-items:center"><small class="muted">Voucher <b style="color:var(--ink);letter-spacing:.05em">${esc(p.voucher_code)}</b> · ${badge(p.voucher_status)}</small><button class="btn sm sec" data-copy="${esc(p.voucher_code)}">Copy</button></div>`:''}</div>`).join(''):'<p class="muted">No purchases yet.</p>'}`;
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyCode(b.dataset.copy,b))})}

/* ---------- admin ---------- */
const NAV=['Dashboard','Customers','Packages','Payments','Hotspots','Sessions','Reports','Settings'];
const ST={Active:0,Inactive:0,Suspended:0};
const SEC={
 Customers:{url:'/customers',filter:['Active','Inactive','Suspended'],view:1,del:'Deactivate',
  cols:[['id','ID'],['full_name','Name'],['phone','Phone'],['email','Email'],['status','Status',badge],['current_package','Package'],['package_expiry','Expiry',fmt],['total_spent','Spent',UGX],['purchases','Purchases'],['created_at','Registered',fmt]],
  form:[['full_name','Full name'],['phone','Phone number'],['email','Email (optional)','email'],['status','Status',['Active','Inactive','Suspended']]]},
 Packages:{url:'/packages',del:'Delete',cols:[['id','ID'],['name','Name'],['description','Description'],['price','Price',UGX],['duration','Duration'],['duration_unit','Unit'],['active','Status',v=>badge(v?'Active':'Inactive')],['created_at','Created',fmt]],
  form:[['name','Name'],['description','Description'],['price','Price (UGX)','number'],['duration','Duration','number'],['duration_unit','Unit',['Minutes','Hours','Days']],['active','Active','check']]},
 Payments:{url:'/payments',filter:['Pending','Completed','Failed','Cancelled','Refunded'],
  cols:[['id','ID'],['customer','Customer'],['package','Package'],['amount','Amount',UGX],['currency','Cur.'],['method','Method'],['provider','Provider'],['provider_txn_id','Provider txn'],['order_ref','Order'],['status','Status',badge],['created_at','Date & time',fmt]],
  extra:r=>r.status==='Pending'?`<button class="btn sm sec" data-act="cash">Confirm cash</button>`:''},
 Hotspots:{url:'/hotspots',filter:['Online','Offline','Maintenance'],cols:[['id','ID'],['name','Name'],['location','Location'],['status','Status',badge],['device_id','Router/device ID'],['created_at','Added',fmt]],
  form:[['name','Name'],['location','Location'],['status','Status',['Online','Offline','Maintenance']],['device_id','Router/device identifier']]},
 Sessions:{url:'/sessions',filter:['Active','Expired','Suspended','Terminated'],cols:[['id','ID'],['customer','Customer'],['package','Package'],['hotspot','Hotspot'],['started_at','Start',fmt],['expires_at','Expiry',fmt],['status','Status',badge],['voucher_code','Voucher'],['mikrotik_username','MikroTik user']],
  extra:r=>r.status==='Active'?`<button class="btn sm sec" data-act="term">Terminate</button>`:''}
};
let cur='Dashboard',rows=[];
function viewAdmin(){
  if(!token)return login();
  shell(`<div class="app"><nav class="side" id="side"><div class="brand">${LOGO}TendoConnect</div>${NAV.map(n=>`<a data-n="${n}">${n}</a>`).join('')}<a id="out" style="margin-top:1rem">Sign out</a></nav><main class="main" id="mn"></main></div>`);
  document.querySelectorAll('[data-n]').forEach(a=>a.onclick=()=>{cur=a.dataset.n;$('#side').classList.remove('open');load()});
  $('#out').onclick=()=>{token=null;localStorage.removeItem('tc_token');route()};load()}
async function login(){
  let setup=false;try{setup=(await api('/auth/status',{auth:false})).setup_required}catch(e){toast(e.message,true)}
  shell(`<div class="wrap" style="max-width:400px;margin-top:8vh"><div class="brand" style="font-size:24px;margin-bottom:1.2rem;--arc:#0f9d8a">${LOGO}TendoConnect Admin</div><div class="card"><h2>${setup?'Create the first admin':'Sign in'}</h2>
  <label for="u">Username</label><input id="u" autocomplete="username"><label for="pw">Password${setup?' (10+ characters)':''}</label><input id="pw" type="password" autocomplete="${setup?'new':'current'}-password">
  ${setup?'<label for="sk">Setup key (your SECRET_KEY)</label><input id="sk" type="password">':''}<p><button class="btn" id="li" style="width:100%">${setup?'Create admin':'Sign in'}</button></p></div></div>`);
  $('#li').onclick=e=>busy(e.target,async()=>{const d=await api(setup?'/auth/setup':'/auth/login',{method:'POST',auth:false,body:{username:$('#u').value,password:$('#pw').value,...(setup?{setup_key:$('#sk').value}:{})}});token=d.token;localStorage.setItem('tc_token',token);viewAdmin()})}
async function load(){
  document.querySelectorAll('[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===cur));
  const m=$('#mn');m.innerHTML=`<div class="bar"><div class="row"><button class="btn sec menu" id="mb" aria-label="Menu">☰</button><h1>${cur}</h1></div><div id="act" class="row"></div></div><div id="c"><p class="muted">Loading…</p></div>`;
  $('#mb').onclick=()=>$('#side').classList.toggle('open');
  try{await({Dashboard:dash,Reports:reports,Settings:settings}[cur]||list)()}catch(e){$('#c').innerHTML=`<div class="err">${esc(e.message)}<br><br><button class="btn sec" onclick="load()">Retry</button></div>`}}
async function dash(){const s=await api('/dashboard/stats');const c=[['Total customers',s.total_customers],['Active customers',s.active_customers],["Today's revenue",UGX(s.revenue_today)],['Total revenue',UGX(s.revenue_total)],['Active sessions',s.active_sessions],['Pending payments',s.pending_payments]];
  $('#c').innerHTML=`<div class="stats">${c.map((x,i)=>`<div class="card${i==2?' key':''}"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}
async function reports(){const r=await api('/reports'),pc=r.payment_counts,mx=Math.max(1,...Object.values(pc));
  $('#c').innerHTML=`<div class="stats">${[['Revenue today',UGX(r.revenue_today)],['Revenue this week',UGX(r.revenue_week)],['Revenue this month',UGX(r.revenue_month)],['Total revenue',UGX(r.revenue_total)],['Customers',r.customers],['Purchases',r.purchases],['Most purchased package',esc(r.top_package||'—')]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
  <div class="card bars" style="margin-top:1rem"><h3>Payments by status</h3>${Object.keys(pc).length?Object.entries(pc).map(([k,v])=>`${badge(k)} ${v}<div style="width:${v/mx*100}%"></div>`).join(''):'<p class="muted">No payments yet.</p>'}</div>`}
async function settings(){const s=await api('/settings/status'),y=v=>v?'Yes':'No';
  $('#c').innerHTML=`<div class="card"><dl class="kv"><dt>Pesapal environment</dt><dd>${esc(s.pesapal_environment)}</dd><dt>Credentials accepted</dt><dd>${y(s.pesapal_credentials_ok)}</dd><dt>IPN registered</dt><dd>${y(s.ipn_registered)}</dd><dt>Callback URL</dt><dd>${esc(s.callback_url)}</dd><dt>IPN URL</dt><dd>${esc(s.ipn_url)}</dd><dt>Router access</dt><dd>Not connected: paid sessions are recorded here but the router is not updated automatically.</dd></dl></div>`}
async function list(){const S=SEC[cur];rows=await api(S.url);
  $('#act').innerHTML=`<input id="q" placeholder="Search…" style="width:200px" aria-label="Search">${S.filter?`<select id="f" style="width:auto" aria-label="Filter"><option value="">All statuses</option>${S.filter.map(x=>`<option>${x}</option>`).join('')}</select>`:''}${S.form?`<button class="btn" id="add">Add ${cur.slice(0,-1).toLowerCase()}</button>`:''}`;
  $('#q').oninput=draw;if(S.filter)$('#f').onchange=draw;if(S.form)$('#add').onclick=()=>edit();draw()}
function draw(){const S=SEC[cur],q=($('#q')?.value||'').toLowerCase(),f=$('#f')?.value||'';
  const v=rows.filter(r=>(!f||r.status===f)&&(!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q)));
  if(!v.length){$('#c').innerHTML=`<div class="card empty">${rows.length?'No results match your search.':'Nothing here yet.'+(S.form?' Use the Add button to create the first one.':'')}</div>`;return}
  $('#c').innerHTML=`<div class="card tw" style="padding:0"><table><thead><tr>${S.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${v.map(r=>`<tr data-id="${r.id}">${S.cols.map(c=>`<td>${c[2]?c[2](r[c[0]]):esc(r[c[0]]??'—')}</td>`).join('')}<td class="row">${S.view?'<button class="btn sm sec" data-act="view">View</button>':''}${S.form?'<button class="btn sm sec" data-act="edit">Edit</button>':''}${S.del?`<button class="btn sm sec" data-act="del">${S.del}</button>`:''}${S.extra?S.extra(r):''}</td></tr>`).join('')}</tbody></table></div>`;
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,rows.find(r=>r.id==b.closest('tr').dataset.id)))}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
function confirmBox(text,label,fn){const m=modal(`<p>${esc(text)}</p><div class="row"><button class="btn bad" id="y">${label}</button><button class="btn sec" id="n">Cancel</button></div>`);$('#n',m).onclick=()=>m.remove();$('#y',m).onclick=e=>busy(e.target,async()=>{await fn();m.remove()})}
function edit(r){const S=SEC[cur],id=r?.id;
  const m=modal(`<h2>${id?'Edit':'Add'} ${cur.slice(0,-1).toLowerCase()}</h2>${S.form.map(([k,l,t])=>t==='check'?`<label><input type="checkbox" id="f_${k}" style="width:auto" ${!r||r[k]?'checked':''}> ${l}</label>`:Array.isArray(t)?`<label>${l}</label><select id="f_${k}">${t.map(o=>`<option ${r?.[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<label>${l}</label><input id="f_${k}" type="${t||'text'}" value="${esc(r?.[k]??'')}">`).join('')}<p class="row"><button class="btn" id="sv">Save</button><button class="btn sec" id="cx">Cancel</button></p>`);
  $('#cx',m).onclick=()=>m.remove();
  $('#sv',m).onclick=e=>busy(e.target,async()=>{const b={};S.form.forEach(([k,,t])=>{const el=$('#f_'+k,m);b[k]=t==='check'?el.checked:t==='number'?+el.value:el.value});
    await api(S.url+(id?'/'+id:''),{method:id?'PUT':'POST',body:b});m.remove();toast('Saved.');list()})}
async function act(a,r){const S=SEC[cur];
  if(a==='edit')return edit(r);
  if(a==='del')return confirmBox(`${S.del} "${r.full_name||r.name}"?`,S.del,async()=>{const d=await api(S.url+'/'+r.id,{method:'DELETE'});toast(d.deactivated?'Package is in use, so it was deactivated instead.':'Done.');list()});
  if(a==='cash')return confirmBox(`Confirm cash received for order ${r.order_ref}? This activates the customer's package.`,'Confirm',async()=>{await api('/payments/'+r.id+'/confirm-cash',{method:'POST'});toast('Payment confirmed and session created.');list()});
  if(a==='term')return confirmBox('Terminate this session? The customer loses access immediately.','Terminate',async()=>{await api('/sessions/'+r.id+'/terminate',{method:'POST'});toast('Session terminated.');list()});
  if(a==='view'){const c=await api('/customers/'+r.id).catch(e=>toast(e.message,true));if(!c)return;const s=c.current_session,l=c.last_payment;
    const m=modal(`<h2>${esc(c.full_name)} ${badge(c.status)}</h2><h3>Profile</h3><dl class="kv"><dt>Phone</dt><dd>${esc(c.phone)}</dd><dt>Email</dt><dd>${esc(c.email||'—')}</dd><dt>Registered</dt><dd>${fmt(c.created_at)}</dd><dt>Package</dt><dd>${esc(c.current_package||'—')}</dd><dt>Expiry</dt><dd>${fmt(c.package_expiry)}</dd></dl>
    <h3 style="margin-top:1rem">Statistics</h3><dl class="kv"><dt>Purchases</dt><dd>${c.purchases}</dd><dt>Total spent</dt><dd>${UGX(c.total_spent)}</dd><dt>Current session</dt><dd>${s?esc(s.package)+' until '+fmt(s.expires_at):'None'}</dd><dt>Last payment</dt><dd>${l?UGX(l.amount)+' on '+fmt(l.paid_at):'—'}</dd></dl>
    <h3 style="margin-top:1rem">Transaction history</h3>${c.transactions.length?c.transactions.map(t=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:.4rem 0"><span>${esc(t.package)}<br><small class="muted">${fmt(t.created_at)} · ${esc(t.method)}</small></span><span>${UGX(t.amount)} ${badge(t.status)}</span></div>`).join(''):'<p class="muted">No transactions yet.</p>'}<p><button class="btn sec" id="cl">Close</button></p>`);$('#cl',m).onclick=()=>m.remove()}}

function route(){const h=location.hash;h.startsWith('#/admin')?viewAdmin():h.startsWith('#/portal')?viewPortal():h.startsWith('#/receipt/')?viewReceipt(h.slice(10)):viewBuy()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
